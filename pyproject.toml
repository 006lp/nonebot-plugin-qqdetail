[project]
name = "nonebot-plugin-qqdetail"
version = "3.0.0-alpha"
description = "NoneBot2 QQ public profile detail query plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "emoji>=2.16,<3",
    "httpx>=0.28,<1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.62.1",
    "nonebot2>=2.5.0",
    "pillow>=12.3",
    "pydantic>=2.13,<3",
    "zhdate>=0.1",
]

[project.urls]
Homepage = "https://github.com/006lp/nonebot-plugin-qqdetail"

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
