[project]
name = "nonebot-plugin-qqdetail"
version = "3.0.0"
description = "NoneBot2 QQ public profile detail query plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.62.0",
    "nonebot2>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
cache-dir = ".tmp/ruff-cache"
exclude = [
    ".git",
    ".ruff_cache",
    ".uv-cache",
    ".venv",
    "docs/",
]