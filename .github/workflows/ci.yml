name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: >-
          uv pip install --system -r pyproject.toml
          "nonebot2[fastapi]" "nonebug>=0.4.4" "pytest>=9.1.1"
          "pytest-asyncio>=1.0" ruff "uv_build>=0.12.22,<0.13"

      - name: Ruff format
        run: ruff format --check nonebot_plugin_qqdetail tests

      - name: Ruff
        run: ruff check nonebot_plugin_qqdetail tests

      - name: Pytest
        run: >-
          python -m pytest tests/ -q
          --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=session

      - name: Build wheel and sdist
        run: uv build --no-build-isolation
