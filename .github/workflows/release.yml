name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v3.0.0-alpha
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install build dependencies
        run: uv pip install --system "uv_build>=0.12.22,<0.13" packaging

      - name: Validate version
        run: |
          python - <<'PY'
          import os, tomllib
          from packaging.version import InvalidVersion, Version

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          try:
              matches = tag.startswith("v") and Version(tag[1:]) == Version(version)
          except InvalidVersion as exc:
              raise SystemExit(f"Invalid PEP 440 release tag: {tag}") from exc
          if not matches:
              raise SystemExit(f"Tag {tag} must match project version v{version}")
          PY

      - name: Build wheel and sdist
        run: uv build --no-build-isolation

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No distribution files found in dist/"
            exit 1
          fi

          release_flags=()
          if [[ "$RELEASE_TAG" =~ (alpha|beta|preview|pre|rc|dev|a|b|c) ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes "${release_flags[@]}"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
