name: 功能建议
title: "Feature: "
description: 为 nonebot-plugin-qqdetail 提出命令、输出模式、配置或维护性改进
labels: ["enhancement"]
assignees: ["006lp"]
body:
  - type: markdown
    attributes:
      value: |
        本项目关注 QQ 公开资料、命令解析、消息展示、权限和可维护性。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，确认这不是重复建议
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      options:
        - 命令或参数
        - 资料字段或脱敏
        - 图片 / 文本输出
        - 入群 / 退群通知
        - 权限或撤回
        - 配置项
        - 文档或示例
        - 测试或持续集成
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 描述当前使用中遇到的痛点，而不是直接从实现细节开始
      placeholder: |
        例如：长签名的卡片内容不易阅读，需要调整展示方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述希望新增或调整的行为，并说明它如何改善现有流程
      placeholder: |
        例如：说明期望的字段排列和文本输出示例。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 说明会影响哪些命令、输出模式、适配器或配置项
      placeholder: |
        命令：qqdetail / box
        输出模式：image / text
        配置项：QQDETAIL_DISPLAY_OPTIONS
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 如果有临时绕过方式、第三方方案或不推荐的做法，可以写在这里

  - type: textarea
    id: examples
    attributes:
      label: 示例
      description: 可提供期望命令、配置、返回文本、日志或 UI 片段
      render: text

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 或协助测试该功能
